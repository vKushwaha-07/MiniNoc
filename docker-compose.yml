version: '3.8'

services:
  # ==========================================
  # 1. Frontend: React App (Served via Nginx)
  # ==========================================
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mininoc-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - noc_net

  # ==========================================
  # 2. Backend: FastAPI Application
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mininoc-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://noc_user:noc_password@db:5432/noc_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change_this_in_production_please
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - noc_net
    volumes:
      # Mount logs for host access
      - ./backend/logs:/app/logs

  # ==========================================
  # 3. Database: PostgreSQL 15 (Production)
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: mininoc-db
    restart: always
    environment:
      - POSTGRES_USER=noc_user
      - POSTGRES_PASSWORD=noc_password
      - POSTGRES_DB=noc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - noc_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noc_user -d noc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 4. Cache/Broker: Redis (Future Async Queue)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: mininoc-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - noc_net
    # Persistence enabled
    command: redis-server --appendonly yes 
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

networks:
  noc_net:
    driver: bridge

# ==========================================
# USAGE INSTRUCTIONS:
# 1. docker-compose up --build -d
# 2. Access dashboard at http://localhost
# 3. Access API docs at http://localhost:8000/docs
# ==========================================
